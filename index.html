 if(p.c!='monge')return _act(s,p,o,k,ax,ay);
 if(k=='u'&&p.ult>=100){_act(s,p,o,k,ax,ay);toggle(s);E('mu',p.x,p.y,0,p.i);return}
 if(k!='a'||p.cd>0)return;
 p.cd=MG.cd;
 const M=MAPS[s.map];
 let dx=ax!=null&&ay!=null?ax:p.fx,dy=ax!=null&&ay!=null?ay:p.fy;const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
 s.fx.push({x:p.x+dx*30,y:p.y+dy*30,t:s.t+.15,r:30,c:'#fff',a:Math.atan2(dy,dx),k:C.monge[2]});E('sw',p.x+dx*30,p.y+dy*30,0,p.i);
 // inimigo: dano + empurrão
 const d=D(p,o);
 if(d<MG.range&&hit(s,o,MG.dmg)){const l=d||1,ux=d>1?(o.x-p.x)/l:dx,uy=d>1?(o.y-p.y)/l:dy;
  o.pd=MG.dist;o.pdx=ux;o.pdy=uy;o.pw=p.i;E('mp',o.x,o.y,0,p.i)}
 // minions do rival (igual ao corpo a corpo)
 s.mn.forEach(m=>{if(m.o==o.i&&m.k!='ghost'&&m.k!='sword'&&D(p,m)<60){m.hp=0;if(m.k=='clone')hit(s,p,10)}});
 // pedaços de parede à frente são empurrados
 (s.pc=s.pc||[]).forEach(c=>{const rx=c.x-p.x,ry=c.y-p.y,l=Math.hypot(rx,ry)||1;
  if(l<MG.pr&&(l<35||(rx*dx+ry*dy)/l>.3)){c.vx=dx*MG.pps;c.vy=dy*MG.pps;c.o=p.i}});
 // parede à frente quebra (a mais próxima)
 let best=null,bd=1e9;
 M.o.forEach(r=>{const cx=Math.max(r[0],Math.min(p.x,r[0]+r[2])),cy=Math.max(r[1],Math.min(p.y,r[1]+r[3])),dd=Math.hypot(cx-p.x,cy-p.y);

 if(best)breakWall(s,best)};

// ---- tempo: borda, empurrão, bônus de velocidade e pedaços ----
const _step=step;
step=function(s,dt,I){
 sync(s);s.pc=s.pc||[];
 s.p.forEach((p,i)=>{if(p.pd>0){I[i].mx=0;I[i].my=0}});   // quem está sendo empurrado não controla
 _step(s,dt,I);
 const M=MAPS[s.map];
 // borda do mapa (animação)
 if(s.b0&&s.bq<1){s.bq=Math.min(1,s.bq+dt/MG.bt);s.bd=s.b0.map((v,i)=>Math.round((v+(s.b1[i]-v)*s.bq)*10)/10)}
 const B=s.bd||[0,0,W,H],full=B[0]<=.5&&B[1]<=.5&&B[2]>=W-.5&&B[3]>=H-.5;
 // a borda esmaga as paredes que alcança
 if(!full)M.o.slice().forEach(r=>{if(r[0]<B[0]+30||r[1]<B[1]+30||r[0]+r[2]>B[2]-30||r[1]+r[3]>B[3]-30)breakWall(s,r)});
 s.p.forEach((p,i)=>{
  // bônus de velocidade do monge
  if(p.mb>0){p.mb-=dt;
   if(p.c=='monge'&&p.pd<=0){const inp=I[i],l=Math.hypot(inp.mx,inp.my);
    if(l>.1&&!(p.stn>0)&&p.fz<=0&&p.pull<=0&&p.dg<=0){const sp=MG.wsp*(p.sl>0?.5:1)*dt;mvp(p,inp.mx/l*sp,inp.my/l*sp,M)}}}
  // empurrão: bateu em parede ou borda = dano extra + bônus de velocidade para o monge
  if(p.pd>0&&s.over<0){let rem=Math.min(p.pd,MG.psp*dt),slam=0;p.pd-=rem;
   while(rem>.01&&!slam){const u=Math.min(4,rem);rem-=u;slam=pmv(p,u,M,B)}
   if(slam){p.pd=0;const w=p.pw;p.pw=-1;E('mw',p.x,p.y,0,w>=0?w:0);hit(s,p,MG.wdmg);if(w>=0)s.p[w].mb=MG.wt}}
  // a borda fechando empurra os jogadores para dentro
  if(!full){p.x=Math.max(B[0]+15,Math.min(B[2]-15,p.x));p.y=Math.max(B[1]+15,Math.min(B[3]-15,p.y))}});
 // pedaços: deslizam, param em paredes/borda, causam dano no inimigo do dono se estiverem rápidos
 s.pc=s.pc.filter(c=>{
  if(!full&&(c.x<B[0]||c.x>B[2]||c.y<B[1]||c.y>B[3]))return false;   // esmagado pela borda
  if(c.vx||c.vy){
   const tx=c.x+c.vx*dt,ty=c.y+c.vy*dt,
    nx=Math.max(B[0]+c.w/2,Math.min(B[2]-c.w/2,tx)),ny=Math.max(B[1]+c.h/2,Math.min(B[3]-c.h/2,ty));
   if(nx!=tx||blkb(M,nx,c.y,3))c.vx=0;else c.x=nx;
   if(ny!=ty||blkb(M,c.x,ny,3))c.vy=0;else c.y=ny;
   const f=Math.exp(-MG.fr*dt);c.vx=Math.round(c.vx*f*10)/10;c.vy=Math.round(c.vy*f*10)/10;
   if(Math.hypot(c.vx,c.vy)<25){c.vx=c.vy=0;c.o=-1}
   c.x=Math.round(c.x*10)/10;c.y=Math.round(c.y*10)/10;
   if(c.o>=0&&Math.hypot(c.vx,c.vy)>120){const e=s.p[1-c.o];
    if(D(c,e)<16+Math.max(c.w,c.h)/2){hit(s,e,MG.pdmg);E('mp',c.x,c.y,0,c.o);return false}}}
  return true})};

    if(Math.random()<dt*60)PT.push({x:v.x,y:v.y,vx:0,vy:0,l:.25,m:.25,c:'#6fc',z:10})}}

 // borda do mapa

 if(B&&(B[0]>.5||B[1]>.5||B[2]<W-.5||B[3]<H-.5)){
